<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="asset/cictt.png" type="image/png" name="icon">
    <title>Happy Teacher's Day!</title>
    <link rel="stylesheet" href="design/css/style.css">
    <script src="design/js/responsive.js"></script>
</head>
<body>
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="https://media.istockphoto.com/id/1635136830/video/happy-teachers-day-text-animation-in-black-color-on-transparent-background-with-handwritten.mp4?s=mp4-640x640-is&k=20&c=fuDRYMBZ-biocedgiqki-mSdQcoWRxmg51MTMZgU5bA=" type="video/mp4">
        </video>
    </div>

    <div class="login-container">
        <form id="login-form" class="login-form">
            <h2>Happy Teacher's Day!</h2>
            <p>A special message awaits you.</p>
            <div class="input-group">
                <input type="text" id="username" placeholder="Fisrt Name (eg. Juan)" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Last Name (eg. Dela Cruz)" required>
            </div>
            <button type="submit">Unlock Your Message</button>
            <p id="error-message" class="error-message"></p>
        </form>
    </div>
    <script src="design/js/login.js"></script>
</body>
</html>
